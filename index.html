<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programación Web III - Portafolio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 10px;
        }
        h2 {
            color: #7f8c8d;
            font-size: 16px;
            margin-bottom: 20px;
        }
        .info {
            font-size: 18px;
            color: #34495e;
            margin-bottom: 30px;
            font-weight: bold;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        a {
            background-color: #3498db;
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }
        a:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Programación Web III</h1>
        <h2>Universidad Mayor de San Andrés</h2>
        <div class="info">ADRIAN GABRIEL CORDERO CHUQUIMIA</div>
        <div class="links">
            <a href="https://github.com/TU_USUARIO" target="_blank">Mi Perfil de GitHub</a>
            <a href="https://TU_USUARIO.github.io/NOMBRE_DE_TU_REPOSITY" target="_blank">Ver Proyecto en Vivo</a>
        </div>
    </div>
</body>
</html>
